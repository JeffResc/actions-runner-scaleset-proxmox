# Default values for the scaleset chart. Override per release in your
# own values.yaml; the only fields that DO have to be set are
# `secrets.github.patValue` (or an existingSecret) and
# `secrets.proxmox.tokenSecretValue`, plus the orchestrator config
# under `scalesetConfig`.

image:
  repository: ghcr.io/jeffresc/actions-runner-scaleset-proxmox
  tag: ""                 # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent
  pullSecrets: []

# 1 replica with the default cluster.mode: standalone — the binary
# implements only "standalone" and "raft", and standalone is always
# leader. HA needs cluster.mode: raft with a peer list + persistent
# data_dir per replica, which requires stable network identities (a
# StatefulSet + headless Service) this Deployment-based chart does not
# yet provide. Do NOT raise replicaCount under standalone: every replica
# would think it is leader and drive the pool independently.
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""                # defaults to the chart fullname
  annotations: {}

# RBAC for leader election. The orchestrator's ONLY Kubernetes
# mutation is on the Lease object it creates — no pods, services,
# endpoints, configmaps, or secrets are touched by the controller.
# This is what makes the deployment GitOps-safe (Flux / Argo CD own
# every other resource; the controller doesn't fight them).
rbac:
  create: true

service:
  type: ClusterIP
  metricsPort: 9100
  adminPort: 9101
  annotations: {}

# Liveness and readiness target the always-on observability port.
# /readyz applies leader-aware semantics: standbys are ready as long
# as Proxmox is reachable; leaders additionally need a connected
# listener and a completed crash-recovery pass. initialDelaySeconds
# on readiness is 15s to give pool.Manager.Recover headroom when
# walking many Proxmox VMs at startup — at 3s the pod flapped under
# anything but the smallest fleet.
probes:
  readiness:
    initialDelaySeconds: 15
    periodSeconds: 5
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10

# Must outlast pool.drain_timeout so a SIGTERM'd leader can drain
# cleanly. Keep this in sync with scalesetConfig.pool.drain_timeout.
terminationGracePeriodSeconds: 1800

# Rolling update with surge=1 / maxUnavailable=0 means the new pod is
# created and becomes ready BEFORE the old one is torn down, but the
# Lease keeps work serialized on a single leader at any moment, so
# there's no double-control-plane risk.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# fsGroup is load-bearing: the config ConfigMap is mounted 0440 and the
# kubelet applies fsGroup as its group owner. Without fsGroup the file
# is root:root 0440, the container user cannot open it, and the pod
# crash-loops. Change runAsUser/fsGroup together, never one alone.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532                # nobody-equivalent; image must support it
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop: ["ALL"]

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}

# topologySpreadConstraints is the most common reason to override the
# defaults — if your control-plane nodes are spread across AZs, you
# want the leader and standby on different ones.
topologySpreadConstraints: []

# Secrets for GitHub auth and Proxmox API. Either set `existingSecret`
# to use a pre-provisioned Opaque secret (recommended for production /
# SealedSecrets / external-secrets), or provide raw values here and
# the chart will create a Secret for you (dev / quick start).
secrets:
  # When set, the chart skips creating a Secret and consumes this one.
  # The referenced Secret must expose keys
  # SCALESET_GITHUB_PAT_TOKEN, SCALESET_PROXMOX_AUTH_TOKEN_SECRET,
  # and (when adminApi enabled) SCALESET_ADMIN_API_SHARED_SECRET.
  # These are the canonical koanf env-override names — the
  # orchestrator picks them up automatically because they match the
  # SCALESET_<yaml.key.path uppercased, dots-to-underscores>
  # convention.
  existingSecret: ""

  github:
    # Used only when existingSecret is empty.
    patValue: ""
  proxmox:
    # Used only when existingSecret is empty.
    tokenSecretValue: ""
  adminApi:
    # Used only when existingSecret is empty. Optional — the admin
    # API is disabled when scalesetConfig.admin_api.http_addr is "".
    sharedSecretValue: ""

# scalesetConfig is the FULL config.yaml content the orchestrator
# reads. See ../../config.example.yaml for the schema. The chart
# defaults cluster.mode to "standalone" when you don't set one (set
# cluster.mode: raft with a peer list for HA); everything else is
# yours to define.
scalesetConfig:
  github:
    auth_mode: pat
    # The PAT token must come from env, supplied by the Secret
    # below as SCALESET_GITHUB_PAT_TOKEN. Don't put secrets in
    # this yaml — it lands in a ConfigMap.
    pat: {}
    scope:
      org: my-org

  scaleset:
    name: proxmox-ubuntu-x64
    labels: [self-hosted, linux, x64, proxmox]
    runner_group: default
    max_concurrent_runners: 50

  proxmox:
    endpoint: https://pve.example.com:8006/api2/json
    auth:
      token_id: scaleset@pve!automation
      # token_secret comes from env (SCALESET_PROXMOX_AUTH_TOKEN_SECRET)
      # via the Secret below — not written here.
    template_vmid: 9000
    vmid_range:
      min: 10000
      max: 19999
    storage:
      disk: local-lvm
      snippets: local
    network:
      bridge: vmbr0

  nodes:
    strategy: single
    single_node: pve1

  pool:
    hot_size: 2
    warm_size: 3
    reconcile_interval: 10s
    vm_max_age: 24h
    drain_timeout: 30m
    boot_max_attempts: 3
    power_poll_interval: 3s

    # Resource-aware admission control. Off by default: concurrency is
    # then bounded only by max_concurrent_runners, as it always has
    # been. Turn it on to gate clones on what actually fits on each
    # Proxmox node — its RAM, minus a host reserve, minus the
    # configured memory of every guest already on it (including guests
    # this orchestrator does not own). "Configured", not "in use": an
    # idle 16 GiB runner owns its full 16 GiB while touching almost
    # none of it.
    #
    # A clone that does not fit is DEFERRED, not failed — the job waits
    # in GitHub's queue and the next reconcile tick retries. Alert on
    # scaleset_clone_deferred_capacity_total.
    #
    # REQUIRES an explicit `profiles:` block below, with memory_mb on
    # every profile. Without one the orchestrator synthesises a single
    # "default" profile that inherits the template's memory, which
    # admission cannot size — config load then fails at startup with
    # `profiles[0] "default": memory_mb must be > 0`. See
    # ../../docs/profiles-and-scaling.md#resource-aware-admission-control.
    #
    # capacity:
    #   enabled: true
    #   # TTL on the cached /cluster/resources read. Lower tracks
    #   # foreign VMs more tightly, higher is lighter on the Proxmox
    #   # API. Default 15s.
    #   refresh_interval: 15s
    #   # Host headroom never planned into — PVE, ZFS ARC and qemu's
    #   # per-VM overhead all live outside the guests' configured
    #   # memory. The effective reserve is the LARGER of the two, so
    #   # you can set a floor and a proportional reserve at once.
    #   # Defaults to 2048 MiB / 0.0.
    #   reserve_memory_mb: 4096
    #   reserve_memory_fraction: 0.1
    #   # Memory is gated hard; CPU is time-shared, so it is gated only
    #   # if you ask. The cap is (physical cores x ratio). 0 (default)
    #   # means vCPUs never refuse a clone.
    #   cpu_overcommit_ratio: 0
    #   # Let a queued job that cannot be placed anywhere reclaim
    #   # capacity from an idle pool VM: the oldest idle one (warm
    #   # before hot) is destroyed and the job admitted on the next
    #   # tick. Nothing is evicted when there is room for both. Off by
    #   # default — it trades a sibling profile's warm-start latency
    #   # for the queued job's ability to run at all.
    #   evict_idle_for_demand: false

  # Runner profiles — named bundles of {labels, template, hardware
  # shape, per-profile pool sizing}. Omit the block entirely and a
  # single "default" profile is synthesised from the scaleset + pool
  # values above (the pre-profiles behaviour).
  #
  # Required as soon as pool.capacity.enabled is set, since admission
  # needs each profile's memory_mb to size a clone. With capacity on,
  # max_concurrent_runners becomes optional — omit it and memory is the
  # only cap.
  #
  # profiles:
  #   - name: mem-4g
  #     labels: [self-hosted, linux, x64, proxmox]
  #     cpu: 2
  #     memory_mb: 4096
  #     warm_size: 2
  #   - name: mem-16g
  #     labels: [self-hosted, linux, x64, proxmox, mem-16g]
  #     cpu: 8
  #     memory_mb: 16384
  #     warm_size: 1

  observability:
    http_addr: ":9100"
    log_level: info
    log_format: json

  admin_api:
    http_addr: ":9101"
    # shared_secret comes from env (SCALESET_ADMIN_API_SHARED_SECRET)
    # via the Secret below — not written here.

# ServiceMonitor for Prometheus-Operator users. Disabled by default
# so the chart doesn't require the CRD; enable when the CRD is
# installed in your cluster.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
